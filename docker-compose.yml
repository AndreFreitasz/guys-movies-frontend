name: guys-movies-frontend

services:
  web:
    build:
      context: .
      target: dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_URL_API: ${NEXT_PUBLIC_URL_API:-https://guys-movies-backend.onrender.com}
      WATCHPACK_POLLING: "true"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next

volumes:
  node_modules:
  next_cache:
